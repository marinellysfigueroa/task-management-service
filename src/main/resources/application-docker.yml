spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:task_management}
    username: ${DB_USERNAME:task_user}
    password: ${DB_PASSWORD:task_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.taskmanagement: INFO
