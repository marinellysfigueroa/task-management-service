app:
  jwt:
    # Dev-only default: a fixed, publicly-visible-in-this-repo secret is fine for
    # running the app on a laptop, and is exactly why application-aws.yml removes
    # the default and requires JWT_SECRET to be set, failing startup otherwise.
    secret: ${JWT_SECRET:7rAVNtHkuy3lZ9fhDFHXgACpPLgzkmkKC8DGyOhAWTI=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: task-management-service

spring:
  application:
    name: task-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        # Defaults applied when the client omits page/size. max-page-size caps
        # what a caller can ask for: without it, ?size=1000000 is a trivial way
        # to make the service materialise an entire table into memory.
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  mvc:
    problemdetails:
      # Boot's built-in RFC 7807 handling for framework exceptions. It is a
      # no-op while GlobalExceptionHandler exists, because Boot backs off when a
      # ResponseEntityExceptionHandler bean is present, and our handler already
      # covers those exceptions. Kept as a safety net so that removing the
      # advice degrades to problem documents instead of Boot's default error
      # body, which would silently change the error contract.
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
