app:
  jwt:
    # No default here, unlike the base application.yml: a production deployment
    # started without JWT_SECRET set must fail at startup, not fall back to the
    # secret checked into this repository.
    secret: ${JWT_SECRET}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    hibernate:
      # Schema is managed via migrations in production; the app never
      # auto-creates or alters tables.
      ddl-auto: validate
    show-sql: false

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.taskmanagement: INFO

management:
  endpoint:
    health:
      show-details: never
